[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "development-harness-internal"
version = "0.17.0"
description = "Development-time project orchestration and deterministic architecture proposals"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = ["pydantic==2.12.5", "PyYAML==6.0.3"]
classifiers = ["Private :: Do Not Upload"]

[project.scripts]
harness = "harness.cli:main"

[dependency-groups]
dev = ["pytest==9.0.2", "ruff==0.14.14"]

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/schemas", "/examples", "/scripts", "/docs", "/README.md", "/Makefile", "/pyproject.toml", "/uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tools", ".uv-cache", ".venv-*", ".template-check", "output"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
